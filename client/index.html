<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maki AI</title>
  <meta name="description" content="Maki AI, a friendly AI study tutor. Talk or type, and ask about any subject.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <!-- Loading screen until the app starts (React replaces everything inside #root). -->
  <style>
    .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 16px; margin: 0; background: #f3f5fb; color: #1d1b17; font: 600 14px/1.5 "Inter", "Segoe UI", system-ui, sans-serif; }
    .boot-orb { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, #6366f1, #8b5cf6); animation: boot-pulse 1.4s ease-in-out infinite; }
    .boot-orb svg { width: 28px; height: 28px; animation: boot-spin 2.8s linear infinite; }
    @keyframes boot-pulse { 0%, 100% { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.45); } 50% { transform: scale(1); box-shadow: 0 0 0 16px rgba(99, 102, 241, 0); } }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) { .boot { background: #0a0e19; color: #f4f1ea; } }
    @media (prefers-reduced-motion: reduce) { .boot-orb, .boot-orb svg { animation: none; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot" role="status">
      <span class="boot-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
      </span>
      <span>Loading Maki AI…</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
